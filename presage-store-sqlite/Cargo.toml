[package]
name = "presage-store-sqlite"
version = "0.8.0-dev"
edition = "2024"
license = "AGPL-3.0-only"

[features]
default = ["libsqlite3-sys/bundled-sqlcipher-custom-crypto"]
cdsi = ["presage/cdsi"]

[dependencies]
presage = { path = "../presage", default-features = false }

async-trait = "0.1.83"
bytes = "1.9.0"
chrono = "0.4.38"
prost = "0.14.4"
serde_json = "1.0.135"
sqlx = { version = "0.9.0", features = [
    "json",
    "sqlite",
    "uuid",
    "runtime-tokio",
] }
thiserror = "2.0.0"
tracing = "0.1.41"
uuid = "1.12.0"

# Explicitly depend on libsqlite3-sys so the crypto-provider feature above is
# applied to the same instance shared with sqlx.
libsqlite3-sys = { version = "0.36.0", features = [] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt", "macros"] }
rand = "0.9"
